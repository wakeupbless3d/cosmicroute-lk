  <style>
:root {
  --bg: #000000;
  --accent: #B14EFF;
  --accent-glow: #D070FF;
  --accent-deep: #6A1FB3;
  --text-1: #FFFFFF;
  --text-2: rgba(255,255,255,0.65);
  --text-3: rgba(255,255,255,0.4);
  --card-bg: rgba(255,255,255,0.04);
  --card-border: rgba(255,255,255,0.08);
  --card-hover: rgba(177,78,255,0.3);
  --danger: #ff6b6b;
  --success: #2ed573;
  --warn: #ff9f43;
  color-scheme: dark;
}
*,*::before,*::after { margin:0;padding:0;box-sizing:border-box }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 30%,#1a0633 0%,#000 70%);
  color:var(--text-1);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Starfield */
#starfield { position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden }
.star {
  position:absolute;
  will-change:transform,opacity;
  animation:drift var(--dur) linear infinite;
  opacity:var(--opa,0.5);
}
@keyframes drift {
  from { transform:translate(0,0) scale(var(--s,1)); opacity:var(--opa,0.5) }
  50% { opacity:calc(var(--opa,0.5) * 1.4) }
  to { transform:translate(calc(cos(var(--angle,0.5)) * var(--dist,100px)), calc(sin(var(--angle,0.5)) * var(--dist,100px))) scale(var(--s,1)); opacity:0 }
}

.vignette { position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.65) 100%);pointer-events:none;z-index:1 }

/* Layout */
.app { position:relative;z-index:10;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem }
.container { width:100%;max-width:420px;display:flex;flex-direction:column;gap:1rem }

/* Logo */
.logo { display:flex;align-items:center;gap:0.6rem;margin-bottom:0.25rem }
.logo img { width:36px;height:36px;filter:drop-shadow(0 0 8px rgba(177,78,255,0.3)) }
.logo span { font-family:'Orbitron',monospace;font-weight:700;font-size:1.05rem;letter-spacing:0.06em;text-shadow:0 0 20px rgba(177,78,255,0.25) }

/* Cards */
.card {
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:16px;
  padding:1.25rem 1.4rem;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  transition:border-color 0.3s,box-shadow 0.3s;
}
.card:hover { border-color:rgba(177,78,255,0.15);box-shadow:0 4px 24px rgba(177,78,255,0.05) }
.card-kicker { font-size:0.65rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3);margin-bottom:0.35rem }
.card-value { font-family:'Orbitron',monospace;font-weight:700;font-size:1.9rem;line-height:1;margin-bottom:0.2rem }
.card-value.accent { color:var(--accent);text-shadow:0 0 20px rgba(177,78,255,0.35) }
.card-value.warn { color:var(--warn) }
.card-value.danger { color:var(--danger) }
.card-sub { font-size:0.78rem;color:var(--text-2) }

/* Progress */
.progress { height:4px;border-radius:4px;background:rgba(255,255,255,0.06);margin-top:0.6rem;overflow:hidden }
.progress-fill { height:100%;border-radius:4px;background:var(--accent);transition:width 0.6s cubic-bezier(0.4,0,0.2,1) }
.progress-fill.warn { background:var(--warn) }
.progress-fill.danger { background:var(--danger) }

/* Sub-link */
.sublink-row { display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem }
.sublink-text { flex:1;font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0.4rem 0.6rem;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px }
.sublink-text.revealed { word-break:break-all;white-space:normal }

/* Buttons */
.btn { display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.7rem 1.2rem;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);border:none;text-decoration:none;font-family:inherit }
.btn:active { transform:scale(0.97) }
.btn-primary { background:#fff;color:#000 }
.btn-primary:hover { background:rgba(255,255,255,0.9);transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,255,255,0.15) }
.btn-secondary { background:var(--card-bg);color:var(--text-1);border:1px solid var(--card-border) }
.btn-secondary:hover { border-color:var(--card-hover);background:rgba(177,78,255,0.06) }
.btn-accent { background:var(--accent);color:#fff }
.btn-accent:hover { background:var(--accent-glow);transform:translateY(-1px);box-shadow:0 6px 24px rgba(177,78,255,0.35) }
.btn-sm { padding:0.45rem 0.8rem;font-size:0.75rem;border-radius:8px }
.btn-full { width:100% }
.btn-row { display:flex;gap:0.5rem;flex-wrap:wrap }
.btn:disabled { opacity:0.5;cursor:not-allowed;transform:none!important }

/* Spinner */
.spinner { width:16px;height:16px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block }
@keyframes spin { to { transform:rotate(360deg) } }

/* Modal */
.modal-overlay { position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.25s }
.modal-overlay.open { opacity:1;pointer-events:all }
.modal-box { background:#0d0d0f;border:1px solid var(--card-border);border-radius:20px;padding:2rem;text-align:center;max-width:320px;width:100%;transform:scale(0.95);transition:transform 0.25s }
.modal-overlay.open .modal-box { transform:scale(1) }

/* Toast */
.toast-container { position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;align-items:center;gap:0.5rem;pointer-events:none }
.toast { padding:0.6rem 1.2rem;border-radius:12px;font-size:0.8rem;font-weight:500;backdrop-filter:blur(16px);border:1px solid;animation:toastIn 0.3s ease,toastOut 0.3s ease 2.7s forwards;pointer-events:auto }
.toast-success { background:rgba(46,213,115,0.12);border-color:rgba(46,213,115,0.3);color:#2ed573 }
.toast-error { background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.3);color:#ff6b6b }
.toast-info { background:rgba(177,78,255,0.12);border-color:rgba(177,78,255,0.3);color:var(--accent-glow) }
@keyframes toastIn { from { opacity:0;transform:translateY(10px) } to { opacity:1;transform:translateY(0) } }
@keyframes toastOut { to { opacity:0;transform:translateY(-5px) } }

/* Login */
.login-title { font-family:'Orbitron',monospace;font-weight:700;font-size:1.35rem;margin-bottom:0.4rem;text-shadow:0 0 20px rgba(177,78,255,0.2) }
.login-sub { font-size:0.82rem;color:var(--text-2);margin-bottom:1.25rem;line-height:1.5 }
.input-group { display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.9rem }
.input-group label { font-size:0.7rem;color:var(--text-3);font-weight:500;letter-spacing:0.03em }
.input-group input { height:44px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);padding:0 1rem;color:#fff;font-size:0.88rem;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s }
.input-group input:focus { border-color:var(--accent);box-shadow:0 0 0 3px rgba(177,78,255,0.1) }
.input-group input::placeholder { color:rgba(255,255,255,0.25) }
.error-msg { color:var(--danger);font-size:0.78rem;margin-bottom:0.6rem;padding:0.5rem 0.7rem;background:rgba(255,107,107,0.06);border:1px solid rgba(255,107,107,0.15);border-radius:8px }

/* Screens */
.screen { display:none }
.screen.active { display:flex;flex-direction:column;gap:1rem;animation:fadeUp 0.4s ease }
@keyframes fadeUp { from { opacity:0;transform:translateY(14px) } to { opacity:1;transform:translateY(0) } }

/* Logout */
.logout-link { font-size:0.72rem;color:var(--text-3);text-decoration:none;margin-top:0.25rem;align-self:center;transition:color 0.2s;padding:0.3rem 0.6rem;border-radius:6px }
.logout-link:hover { color:var(--danger);background:rgba(255,107,107,0.06) }

/* Responsive */
@media(max-width:480px) {
  .app { padding:1.5rem 0.75rem }
  .card { padding:1rem 1.1rem }
  .card-value { font-size:1.6rem }
  .logo img { width:30px;height:30px }
  .logo span { font-size:0.9rem }
}
@media(max-height:667px) {
  .app { padding:1rem 0.75rem;justify-content:flex-start;padding-top:2rem }
  .container { gap:0.75rem }
}
  </style>
</head>

  <script>
(function() {
'use strict';

const API = 'https://cr-freedom.space/api';
const LS_TOKEN = 'cr_token';
const LS_SUB = 'cr_sublink';

// --- Starfield ---
function initStarfield() {
  const el = document.getElementById('starfield');
  const count = 35;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const dur = Math.random() * 40 + 30;
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 120 + 60;
    const opa = Math.random() * 0.5 + 0.2;
    star.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;border-radius:50%;background:#fff;--dur:${dur}s;--angle:${angle};--dist:${dist}px;--opa:${opa};--s:${Math.random()*0.5+0.8}`;
    el.appendChild(star);
  }
}

// --- Toast ---
function toast(msg, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(function() { t.remove(); }, 3200);
}

// --- API helpers ---
function apiPost(path, body) {
  return fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); });
}

function apiGet(path, token) {
  return fetch(API + path, {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function(r) {
    if (r.status === 401) { logout(); throw new Error('unauthorized'); }
    return r.json();
  });
}

// --- Auth ---
function getToken() { return localStorage.getItem(LS_TOKEN); }
function setToken(t) { localStorage.setItem(LS_TOKEN, t); }
function getSavedSub() { return localStorage.getItem(LS_SUB) || ''; }
function setSavedSub(s) { localStorage.setItem(LS_SUB, s); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function logout() {
  localStorage.removeItem(LS_TOKEN);
  showScreen('screen-login');
}

// --- Login ---
function doLogin() {
  var sublink = document.getElementById('inp-sublink').value.trim();
  var password = document.getElementById('inp-password').value;
  var errEl = document.getElementById('login-error');
  var btn = document.getElementById('btn-login');
  var btnText = document.getElementById('login-text');

  errEl.style.display = 'none';
  if (!sublink || !password) {
    errEl.textContent = 'Заполните оба поля';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span>';

  apiPost('/auth/login', { subLink: sublink, password: password })
    .then(function(data) {
      if (data.token) {
        setToken(data.token);
        setSavedSub(sublink);
        showScreen('screen-dashboard');
        loadDashboard();
        toast('Добро пожаловать!', 'success');
      } else {
        throw new Error(data.message || 'Ошибка входа');
      }
    })
    .catch(function(e) {
      errEl.textContent = e.message || 'Не удалось войти';
      errEl.style.display = 'block';
    })
    .finally(function() {
      btn.disabled = false;
      btnText.textContent = 'Войти';
    });
}

// --- Dashboard ---
function loadDashboard() {
  var token = getToken();
  if (!token) return;

  apiGet('/me', token).then(function(data) {
    var user = data.user || data;
    renderSubscription(user);
    renderBalance(user);
    renderSublink(user);
  }).catch(function() {
    toast('Ошибка загрузки данных', 'error');
  });
}

function renderSubscription(user) {
  var daysEl = document.getElementById('sub-days');
  var expiresEl = document.getElementById('sub-expires');
  var progressEl = document.getElementById('sub-progress');

  var sub = user.subscription;
  if (!sub || !sub.expiresAt) {
    daysEl.textContent = 'Нет';
    daysEl.className = 'card-value danger';
    expiresEl.textContent = 'Подписка не активна';
    progressEl.style.width = '0%';
    return;
  }

  var now = Date.now();
  var expires = new Date(sub.expiresAt).getTime();
  var days = Math.max(0, Math.ceil((expires - now) / 86400000));
  var totalDays = sub.durationDays || 30;
  var pct = Math.min(100, Math.round((days / totalDays) * 100));

  daysEl.textContent = days + ' дн.';
  if (days <= 3) {
    daysEl.className = 'card-value danger';
    progressEl.className = 'progress-fill danger';
  } else if (days <= 7) {
    daysEl.className = 'card-value warn';
    progressEl.className = 'progress-fill warn';
  } else {
    daysEl.className = 'card-value accent';
    progressEl.className = 'progress-fill';
  }

  var expDate = new Date(sub.expiresAt);
  expiresEl.textContent = 'до ' + expDate.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  progressEl.style.width = pct + '%';
}

function renderBalance(user) {
  var val = document.getElementById('balance-value');
  var sub = document.getElementById('balance-sub');
  var kopeks = user.balanceKopeks || 0;
  var rub = (kopeks / 100).toFixed(0);
  val.textContent = rub + ' ₽';
  if (kopeks <= 0) {
    sub.textContent = 'Пополните для продления';
  } else {
    sub.textContent = 'Доступно для продления';
  }
}

function renderSublink(user) {
  var link = user.subLink || getSavedSub();
  if (link) setSavedSub(link);
  document.getElementById('sublink-display').dataset.full = link;
  hideSublink();
}

// --- Sub-link actions ---
var sublinkRevealed = false;

function hideSublink() {
  var el = document.getElementById('sublink-display');
  el.textContent = '••••••••••••••••••••';
  el.classList.remove('revealed');
  sublinkRevealed = false;
  document.getElementById('btn-reveal').textContent = 'Показать';
}

function revealSublink() {
  var el = document.getElementById('sublink-display');
  el.textContent = el.dataset.full || '—';
  el.classList.add('revealed');
  sublinkRevealed = true;
  document.getElementById('btn-reveal').textContent = 'Скрыть';
}
function toggleSublink() {
  if (sublinkRevealed) hideSublink();
  else revealSublink();
}

function copySublink() {
  var link = document.getElementById('sublink-display').dataset.full;
  if (!link) { toast('Нет ссылки', 'error'); return; }
  navigator.clipboard.writeText(link).then(function() {
    toast('Скопировано!', 'success');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = link;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Скопировано!', 'success');
  });
}

// --- QR ---
function openQR() {
  var link = document.getElementById('sublink-display').dataset.full;
  if (!link) { toast('Нет ссылки', 'error'); return; }
  var img = document.getElementById('qr-img');
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link);
  document.getElementById('qr-modal').classList.add('open');
}

function closeQR() {
  document.getElementById('qr-modal').classList.remove('open');
}

// --- Top-up ---
function openTopUp() {
  toast('Перенаправление на оплату…', 'info');
  setTimeout(function() {
    window.open('https://t.me/CosmicRouteVPN', '_blank');
  }, 600);
}

// --- Init ---
document.addEventListener('DOMContentLoaded', function() {
  initStarfield();

  var savedSub = getSavedSub();
  if (savedSub) document.getElementById('inp-sublink').value = savedSub;

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('inp-password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('inp-sublink').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('inp-password').focus();
  });

  document.getElementById('btn-reveal').addEventListener('click', toggleSublink);
  document.getElementById('btn-copy').addEventListener('click', copySublink);
  document.getElementById('btn-qr').addEventListener('click', openQR);
  document.getElementById('btn-topup').addEventListener('click', openTopUp);
  document.getElementById('btn-logout').addEventListener('click', function(e) {
    e.preventDefault();
    logout();
    toast('Вы вышли из кабинета', 'info');
  });

  if (getToken()) {
    showScreen('screen-dashboard');
    loadDashboard();
  }
});

window.closeQR = closeQR;
})();
  </script>
</body>
</html>
